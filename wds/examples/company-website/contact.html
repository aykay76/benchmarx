<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Acme</title>
  <script>
    const t = localStorage.getItem("wds-theme");
    if (t) document.documentElement.setAttribute("data-wds-theme", t);
  </script>
  <link rel="stylesheet" href="../../wds.css" />
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="../../wds.js"></script>
</head>
<body>
  <header>
    <nav class="wds-navbar site-navbar">
      <a class="wds-navbar-brand" href="./index.html"><wds-icon name="home"></wds-icon> Acme</a>
      <div class="site-nav-links">
        <a href="./index.html#features">Features</a>
        <a href="./index.html#pricing">Pricing</a>
        <a href="./about.html">About</a>
        <a href="./contact.html" aria-current="page">Contact</a>
      </div>
      <div class="wds-navbar-spacer"></div>
      <a class="wds-btn wds-btn--ghost wds-btn--sm" href="./contact.html">Log in</a>
      <a class="wds-btn wds-btn--primary wds-btn--sm" href="./contact.html">Get started</a>
    </nav>
  </header>

  <main class="content-page">
    <h1>Get in touch</h1>
    <p class="wds-text-muted wds-mb-lg">
      Questions about pricing, enterprise plans, or anything else — our team usually replies within a
      business day.
    </p>

    <form id="contact-form" novalidate>
      <div class="wds-field">
        <label class="wds-label wds-label--required" for="name">Name</label>
        <input class="wds-input" id="name" name="name" required />
      </div>
      <div class="wds-field">
        <label class="wds-label wds-label--required" for="email">Work email</label>
        <input class="wds-input" id="email" name="email" type="email" required />
      </div>
      <div class="wds-field">
        <label class="wds-label" for="company">Company</label>
        <input class="wds-input" id="company" name="company" />
      </div>
      <div class="wds-field">
        <label class="wds-label wds-label--required" for="message">Message</label>
        <textarea class="wds-textarea" id="message" name="message" rows="5" required></textarea>
      </div>
      <button class="wds-btn wds-btn--primary" type="submit">Send message</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <span>© 2026 Acme, Inc.</span>
      <span>Built with WDS</span>
    </div>
  </footer>

  <script type="module">
    import { toast } from "../../wds.js";

    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!e.target.checkValidity()) {
        e.target.reportValidity();
        return;
      }
      toast.success("Message sent", { message: "We'll get back to you within one business day." });
      e.target.reset();
    });
  </script>
</body>
</html>
